<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aubria</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #060f1e;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      padding-top: 20vh;
      text-align: center;
    }

    .logo {
      width: min(500px, 80vw);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="aubria.png" alt="Aubria" />
  </div>
</body>
</html>
